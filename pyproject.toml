[project]
name = "url-shortener"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29",
    "redis[asyncio]>=5.0",
    "httpx>=0.27.0",
    "bcrypt>=4.0",
    "pyjwt[crypto]>=2.13.0",
]

[tool.pytest.ini_options]
python_files = ["ut_*.py", "it_*.py", "e2e_*.py", "test_*.py"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
