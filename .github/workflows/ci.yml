name: CI

on:
  pull_request:
  push:
    branches: [master, go]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Format check
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: Unit tests with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Compile tagged E2E tests
        run: go test -tags=e2e -run '^$' ./tests/e2e
      - name: Static analysis
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  terraform:
    name: Terraform verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Format check
        run: terraform fmt -check -recursive infra_tf
      - name: Initialize providers
        run: terraform -chdir=infra_tf init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=infra_tf validate

  containers:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [shortener, analytics]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: microservice-auth-platform/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
